
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Buddha Spa</title>


  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: #fff;
      border: 1px solid #e9e4dc;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header img {
      height: 150px;
    }

    .login-header h2 {
      margin-top: 15px;
      font-size: 24px;
      color: #7e0000;
    }

    .login-header p {
      font-size: 14px;
      color: #a89c84;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 14px;
      color: #7a6c4f;
      margin-bottom: 4px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0dcd1;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
    }

    input:focus {
      outline: none;
      border-color: #d4c5a8;
      box-shadow: 0 0 0 2px #f0e8d6;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .form-options a {
      color: #a89c84;
      text-decoration: none;
    }

    .form-options a:hover {
      text-decoration: underline;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #7a6c4f;
    }

    button {
      background-color: #7e0000;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #b49a7e;
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #a89c84;
    }

    .signup a {
      color: #7a6c4f;
      text-decoration: none;
      font-weight: 500;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>


</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="assets/img/cropped-LOGO-2.png" alt="Buddha Spa">
      <h2>Bem-vindo(a)</h2>
      <p>Faça login para continuar</p>
    </div>

    <form>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com">
      </div>

      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••">
      </div>

      <div class="form-options">
        <label class="checkbox">
          <input type="checkbox">
          Lembrar-me
        </label>
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <p class="signup">
      Ainda não tem uma conta? <a href="#">Cadastre-se</a><br>
      Voltar para Loja <a href="lojafranqueados.html">Voltar</a>
    </p>
  </div>

</body>
</html>
